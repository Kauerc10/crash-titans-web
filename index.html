<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#23130b" />
    <title>Crash of the Titans · Menu</title>
    <link rel="icon" href="./public/assets/fe_footprint.webp" type="image/webp" />
    <link rel="preload" as="image" href="./public/assets/fe_title_logo.webp" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main id="game" aria-label="Crash of the Titans">
      <div id="viewport">
        <div id="stage">
          <div class="backdrop" aria-hidden="true">
            <div class="cloth"></div><div class="weave"></div><div class="light"></div>
            <div class="leaves leaves-top"></div><div class="leaves leaves-bottom"></div>
            <div class="vignette"></div>
          </div>
          <div id="screen"><p class="loading">CRASH OF THE TITANS<br /><small>Loading…</small></p></div>
          <nav id="hints" aria-label="Controls"></nav>
        </div>
      </div>
      <div id="toolbar">
        <span id="preview-label">MENU PREVIEW</span>
        <div>
          <button id="sound-toggle" aria-label="Mute audio" title="Mute audio">♪</button>
          <button id="fullscreen" aria-label="Fullscreen" title="Fullscreen">⛶</button>
        </div>
      </div>
      <p id="live" class="sr-only" aria-live="polite"></p>
    </main>
    <noscript>This menu requires JavaScript.</noscript>
    <script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
